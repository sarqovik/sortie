<!doctype html><html><head><meta charset="utf-8"></head><body>
<script type="module">
const out=[];
const { VIEW } = await import('./src/config.js');
const { PANELS, bodyToWorld } = await import('./src/aircraftMesh.js');
const { cameraBasis, project } = await import('./src/math3d.js');

function frameFor(roll, pitch, cam){
  const ac={position:{x:0,y:200,z:0},heading:0,pitch,roll};
  const pos={x:0,y:200+cam.up,z:-cam.back};
  const lift=Math.sin(pitch)*cam.lookAhead*cam.follow;
  const tgt={x:0,y:200-cam.lookDrop+lift,z:cam.lookAhead};
  const basis=cameraBasis(pos,tgt,cam.fov,VIEW.width);
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  for(const p of PANELS) for(const v of p.points){
    const w=bodyToWorld([v[0],v[1],v[2]],ac);
    const s=project(basis,w,VIEW.width,VIEW.height,0.6);
    if(!s.visible) continue;
    if(s.x<minX)minX=s.x; if(s.x>maxX)maxX=s.x;
    if(s.y<minY)minY=s.y; if(s.y>maxY)maxY=s.y;
  }
  return {minX,maxX,minY,maxY};
}
const cases=[['bank',-30,0.10],['low',14,0.05],['late',-12,-0.06]];
out.push('searching fov 1.02..1.60 x back 30..60 x up 5..14');
out.push('constraint: x[40..1240] y[20..600]  (HUD bottom at 612)');
out.push('');
let best=null;
for(const fov of [1.02,1.10,1.18,1.26,1.34,1.42,1.50,1.60]){
 for(const back of [30,34,38,42,46,50,56,60]){
  for(const up of [5,6.2,8,10,12,14]){
    const cam={back,up,lookAhead:62,lookDrop:1.2,follow:0.85,fov};
    let ok=true, det=[];
    for(const [n,rd,pt] of cases){
      const r=frameFor(rd*Math.PI/180,pt,cam);
      if(r.minX<40||r.maxX>1240||r.minY<20||r.maxY>600) ok=false;
      det.push(`${n}[${r.maxX-r.minX|0}x${r.maxY-r.minY|0}]`);
    }
    if(ok){
      // prefer smallest fov change and closest camera (largest airframe on screen)
      const score = Math.abs(fov-1.02)*10 + Math.abs(back-30)*0.5;
      if(!best||score<best.score) best={fov,back,up,score,det};
    }
  }
 }
}
if(best) out.push(`BEST fov=${best.fov} back=${best.back} up=${best.up}  ${best.det.join(' ')}`);
else out.push('none found');
const p=document.createElement('pre');p.id='out';p.textContent=out.join('\n');
document.body.appendChild(p);
</script></body></html>
