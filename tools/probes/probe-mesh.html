<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mesh probe</title>
<style>
  html, body { margin: 0; background: #101820; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="probe" width="1280" height="720"></canvas>
<script type="module">
// A flat-shaded, isolated render of the aircraft mesh on a neutral background. No terrain, no sky,
// no HUD: just the panels, so a symmetry measurement reads the airframe and nothing else. Each panel
// is filled with a colour keyed to its own index, so the probe can tell the port and starboard
// halves apart by pixel value rather than by guessing at thresholds.
import { PANELS } from './src/aircraftMesh.js';
import { bodyToWorld, bodyDirectionToWorld } from './src/aircraftMesh.js';
import { cameraBasis, dot, normalize, project, sub } from './src/math3d.js';

const canvas = document.getElementById('probe');
const ctx = canvas.getContext('2d', { alpha: false });
const W = canvas.width;
const H = canvas.height;

// A chase camera, level, directly behind: the pose that must show both wings equally.
const aircraft = {
  position: { x: 0, y: 0, z: 0 },
  heading: 0,
  pitch: 0,
  roll: 0,
};

const cameraPos = { x: 0, y: 9, z: -34 };
const target = { x: 0, y: 0, z: 0 };
const basis = cameraBasis(cameraPos, target, 1.02, W);
const toCamera = normalize(sub(basis.position, aircraft.position));

ctx.fillStyle = '#101820';
ctx.fillRect(0, 0, W, H);

const drawn = [];
for (const panel of PANELS) {
  const n = panel.normal;
  const normalWorld = bodyDirectionToWorld([n[0], n[1], n[2]], aircraft);
  if (dot(normalWorld, toCamera) < -0.05) continue;

  const pts = panel.points.map((p) => project(basis, bodyToWorld(p, aircraft), W, H, 0.6));
  if (!pts.every((p) => p.visible)) continue;
  const depth = pts.reduce((s, p) => s + p.depth, 0) / pts.length;
  drawn.push({ panel, pts, depth });
}
drawn.sort((a, b) => b.depth - a.depth);

// Colour by side: port panels in the red channel, starboard in the green, centreline in white.
for (const d of drawn) {
  const name = d.panel.name;
  let fill;
  if (/Left/.test(name)) fill = '#ff0000';
  else if (/Right/.test(name)) fill = '#00ff00';
  else fill = '#ffffff';
  ctx.fillStyle = fill;
  ctx.beginPath();
  ctx.moveTo(d.pts[0].x, d.pts[0].y);
  for (let i = 1; i < d.pts.length; i += 1) ctx.lineTo(d.pts[i].x, d.pts[i].y);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#000000';
  ctx.lineWidth = 1;
  ctx.stroke();
}

// Report the panel names that survived, so the page can be read without a screenshot.
const names = drawn.map((d) => d.panel.name);
document.title = `drawn:${drawn.length}|${names.join(',')}`;
window.__probe = { drawn: names, total: PANELS.length };
</script>
</body>
</html>
