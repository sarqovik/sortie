<!doctype html><html><head><meta charset="utf-8"></head><body>
<script type="module">
const out=[];
const { VIEW } = await import('./src/config.js');
const { PANELS, bodyToWorld } = await import('./src/aircraftMesh.js');
const { cameraBasis, project } = await import('./src/math3d.js');
function frameFor(roll, pitch, cam){
  const ac={position:{x:0,y:200,z:0},heading:0,pitch,roll};
  const pos={x:0,y:200+cam.up,z:-cam.back};
  const lift=Math.sin(pitch)*cam.lookAhead*cam.follow;
  const tgt={x:0,y:200-cam.lookDrop+lift,z:cam.lookAhead};
  const basis=cameraBasis(pos,tgt,cam.fov,VIEW.width);
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  for(const p of PANELS) for(const v of p.points){
    const w=bodyToWorld([v[0],v[1],v[2]],ac);
    const s=project(basis,w,VIEW.width,VIEW.height,0.6);
    if(!s.visible) continue;
    if(s.x<minX)minX=s.x; if(s.x>maxX)maxX=s.x;
    if(s.y<minY)minY=s.y; if(s.y>maxY)maxY=s.y;
  }
  return {minX,maxX,minY,maxY};
}
out.push('max roll that fits y[20..600] at fov 1.02, back=34, up=8');
out.push('');
for(const back of [30,34,38,42]){
 for(const up of [6.2,8,10]){
  let maxRoll=0;
  for(let rd=-40;rd<=0;rd+=1){
    const r=frameFor(rd*Math.PI/180,0.10,{back,up,lookAhead:62,lookDrop:1.2,follow:0.85,fov:1.02});
    if(r.maxY<=600&&r.minY>=20&&r.minX>=40&&r.maxX<=1240) maxRoll=rd;
  }
  out.push(`back=${back} up=${up} -> max |roll| = ${Math.abs(maxRoll)} deg`);
 }
}
const p=document.createElement('pre');p.id='out';p.textContent=out.join('\n');
document.body.appendChild(p);
</script></body></html>
