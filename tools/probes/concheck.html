<!doctype html><html><head><meta charset="utf-8"></head><body>
<canvas id="game" width="1280" height="720"></canvas><div id="status"></div>
<script>
window.__errs=[];
window.addEventListener('error',e=>window.__errs.push('ERR '+e.message));
window.addEventListener('unhandledrejection',e=>window.__errs.push('REJ '+e.reason));
</script>
<script type="module">
import('/src/main.js').catch(e=>{window.__errs.push('IMPORT '+e.message);});
</script></body></html>
