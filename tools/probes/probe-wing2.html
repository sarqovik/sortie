<!doctype html><html><head><meta charset="utf-8"></head><body>
<script type="module">
const out=[];
const { CAMERA, VIEW } = await import('./src/config.js');
const { PANELS, bodyToWorld } = await import('./src/aircraftMesh.js');
const { cameraBasis, project } = await import('./src/math3d.js');

function frameFor(roll, pitch, cam){
  const ac={position:{x:0,y:200,z:0},heading:0,pitch,roll};
  const pos={x:0,y:200+cam.up,z:-cam.back};
  const lift=Math.sin(pitch)*cam.lookAhead*cam.follow;
  const tgt={x:0,y:200-cam.lookDrop+lift,z:cam.lookAhead};
  const basis=cameraBasis(pos,tgt,CAMERA.fov,VIEW.width);
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  for(const p of PANELS) for(const v of p.points){
    const w=bodyToWorld([v[0],v[1],v[2]],ac);
    const s=project(basis,w,VIEW.width,VIEW.height,CAMERA.near);
    if(!s.visible) continue;
    if(s.x<minX)minX=s.x; if(s.x>maxX)maxX=s.x;
    if(s.y<minY)minY=s.y; if(s.y>maxY)maxY=s.y;
  }
  return {minX,maxX,minY,maxY};
}
const cases=[['bank',-30,0.10],['low',14,0.05],['late',-12,-0.06]];
// HUD safe zone: bottom panels start at y=612 (AIRSPEED) and 662 (ALTITUDE).
// Keep the airframe above y=600 and inside x[40..1240].
out.push('target: all vertices inside x[40..1240] y[20..600]');
out.push('');
for(const back of [30,34,38,42,46,50]){
  for(const up of [6.2,8,10,12]){
    const cam={back,up,lookAhead:62,lookDrop:1.2,follow:0.85};
    let worst=null, ok=true;
    const det=[];
    for(const [n,rd,pt] of cases){
      const r=frameFor(rd*Math.PI/180,pt,cam);
      const bad = r.minX<40||r.maxX>1240||r.minY<20||r.maxY>600;
      if(bad) ok=false;
      det.push(`${n}:x[${r.minX.toFixed(0)}..${r.maxX.toFixed(0)}]y[${r.minY.toFixed(0)}..${r.maxY.toFixed(0)}]`);
    }
    if(ok) out.push(`back=${back} up=${up}  OK   ${det.join('  ')}`);
  }
}
const p=document.createElement('pre');p.id='out';p.textContent=out.join('\n');
document.body.appendChild(p);
</script></body></html>
